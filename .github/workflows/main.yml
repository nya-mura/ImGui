
name: Build Android Library

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Android
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build and inspect
        run: |
          cmake --build build --verbose
          find build -name 'libtest.so' -print

          ELF="$(find build -name 'libtest.so' -print -quit)"
          test -n "$ELF"

          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$ELF"

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: android-imgui-lib
          path: build/**/libtest.so

